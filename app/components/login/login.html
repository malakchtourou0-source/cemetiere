<!-- login.html — formulaire à gauche, brand à droite -->
<div class="login-wrapper">

  <!-- ── Côté gauche — Formulaire ── -->
  <div class="login-left">
    <div class="login-box">

      <h2 class="login-title">Connexion</h2>
      <p class="login-sub">خدمة الحالة المدنية</p>

      @if (erreur) {
        <div class="alert-error">⚠️ {{ erreur }}</div>
      }

      <div class="field">
        <label>تسجيل الدخول</label>
        <input type="text"
               placeholder="أدخل بيانات تسجيل الدخول "
               [(ngModel)]="login"
               (keyup.enter)="seConnecter()">
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input type="password"
               placeholder="••••••••"
               [(ngModel)]="motDePasse"
               (keyup.enter)="seConnecter()">
      </div>

      <button class="btn-login"
              (click)="seConnecter()"
              [disabled]="chargement">
        @if (chargement) {
          <span class="spinner"></span> Connexion...
        } @else {
          تسجيل الدخول →
        }
      </button>

    </div>
  </div>

  <!-- ── Côté droit — Brand ── -->
  <div class="login-right">
    <div class="brand">
      <img src="logo_commune.png" class="brand-logo-img" alt="بلدية صفاقس">
      <h1>بلدية صفاقس</h1>
      <p>Commune de Sfax</p>
      <div class="divider"></div>
      <p class="subtitle">
        نظام تسيير الجثث والمقابر<br>
        Gestion des cadavres et cimetières
      </p>
    </div>
  </div>

</div>
